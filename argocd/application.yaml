apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cpp-demo
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/thunderkite/cpp-gitops-demo.git
    targetRevision: main
    path: manifests
  destination:
    server: https://kubernetes.default.svc
    namespace: cpp-demo
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
