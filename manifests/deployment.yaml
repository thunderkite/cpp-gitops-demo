apiVersion: apps/v1
kind: Deployment
metadata:
  name: cpp-demo
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cpp-demo
  template:
    metadata:
      labels:
        app: cpp-demo
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
      containers:
        - name: cpp-demo
          image: cpp-demo:v2
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: GREETING
              value: "Hello, GitOps!"
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
